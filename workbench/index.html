<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>深空 · 内容工作台</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="mark">P / R</span><div><strong>深空内容工作台</strong><small>人物、剧情与物品 · 本地内容包</small></div></div><div class="actions"><button id="new">新建内容包</button><button id="import">导入文件夹</button><button id="check">检查</button><button id="export" class="primary">导出 ZIP</button></div></header>
<main><aside><label>当前内容包<input id="pack-id" aria-label="内容包 ID" placeholder="例如 mypack"></label><label>名称<input id="pack-name" aria-label="内容包名称"></label><label>优先级<input id="priority" type="number" min="0" max="1000000" value="200"></label><nav aria-label="内容类型"><button data-tab="characters" class="selected">人物与立绘<span></span></button><button data-tab="dialogues">原版台词配图<span></span></button><button data-tab="items">物品与图标<span></span></button><button data-tab="actors">新增来店人物<span></span></button><button data-tab="stories">剧情与分支<span></span></button></nav><p class="hint">所有资料保留在本机。图片保存在浏览器本地数据库，导出 ZIP 后才成为可分发的内容包。</p><div id="summary"></div></aside>
<section class="library"><div class="section-head"><div><small id="eyebrow">原版目录</small><h1 id="title">人物与立绘</h1></div><button id="add">＋ 新增</button></div><label class="search"><span>检索</span><input id="search" aria-label="检索内容" placeholder="名称、ID 或台词"></label><div id="list" role="list"></div></section>
<section class="inspector"><div id="detail"><div class="empty"><span>01 / CONTENT</span><h2>从一个内容开始</h2><p>选择左侧目录中的人物、台词或物品。新增剧情可以关联自己的角色与物品，并设置条件和结果。</p></div></div></section></main>
<footer><span id="status" role="status" aria-live="polite">就绪</span><span>本地工作台 · 游戏基线 26337366</span></footer><input id="folder" type="file" webkitdirectory multiple hidden><input id="image" type="file" accept="image/png" hidden>
<dialog id="errors"><h2>内容包检查</h2><pre></pre><button id="close-errors">关闭</button></dialog>
<script src="data.js"></script><script src="app.js"></script></body></html>
